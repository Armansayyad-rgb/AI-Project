name: RALG CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q config.py src

      - name: Validate benchmark JSONL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = [
              Path("data/technical_doc_benchmark_v1.jsonl"),
              Path("data/technical_doc_benchmark_hard_v1.jsonl"),
          ]
          for path in files:
              for line_no, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if line.strip():
                      json.loads(line)
              print(f"validated {path}")
          PY

      - name: Check required public files
        run: |
          test -f README.md
          test -f LICENSE
          test -f SECURITY.md
          test -f BENCHMARK_RESULTS.md
          test -f RELIABILITY_BENCHMARK.md
